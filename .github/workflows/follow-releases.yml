name: Follow releases

# The tap updates itself rather than being pushed to, so no repository needs a token for
# another one. It checks a few times a day and on demand.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pitboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Take the newest release
        run: |
          set -euo pipefail
          tag=$(curl -fsSL https://api.github.com/repos/datlechin/pitboard/releases/latest \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          version=${tag#v}
          if grep -q "version \"$version\"" Casks/pitboard.rb; then
            echo "already at $tag"
            exit 0
          fi
          work=$(mktemp -d)
          curl -fsSL -o "$work/source.tar.gz" \
            "https://github.com/datlechin/pitboard/archive/refs/tags/$tag.tar.gz"
          curl -fsSL -o "$work/app.zip" \
            "https://github.com/datlechin/pitboard/releases/download/$tag/Pitboard-$tag-macos.zip"
          source_sha=$(sha256sum "$work/source.tar.gz" | cut -d' ' -f1)
          app_sha=$(sha256sum "$work/app.zip" | cut -d' ' -f1)
          sed -i -e "s|/archive/refs/tags/v[0-9.]*\.tar\.gz|/archive/refs/tags/$tag.tar.gz|" \
                 -e "s|^  sha256 \".*\"|  sha256 \"$source_sha\"|" Formula/pitboard.rb
          sed -i -e "s|^  version \".*\"|  version \"$version\"|" \
                 -e "s|^  sha256 \".*\"|  sha256 \"$app_sha\"|" Casks/pitboard.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "pitboard $version"
          git push
